services:
  tandem:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIRECTORY: /data
    volumes:
      - tandem-data:/data
    # Keep the signaling listener private; only Caddy accepts Internet traffic.
    expose:
      - '8787'
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TANDEM_DOMAIN: ${TANDEM_DOMAIN:?Set TANDEM_DOMAIN to your public DNS name}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tandem
volumes:
  tandem-data:
  caddy-data:
  caddy-config:
