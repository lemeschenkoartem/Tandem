name: Publish verified Tandem 0.3.1
on:
  push:
    branches:
      - upload/windows-0.3.1
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read prepared source and release evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve and verify the prepared Windows archive
        run: |
          mkdir -p release-assets
          curl --fail --location --show-error --retry 2 --connect-timeout 30 --max-time 600 https://files.catbox.moe/0bai92.zip --output release-assets/Tandem-0.3.1-Windows-x64.zip
          echo 'dc3509f3674cebf48cb1c63822be7a356426531e8cd31d6e81a803eba5b0fc5e  release-assets/Tandem-0.3.1-Windows-x64.zip' | sha256sum --check --strict
          git archive --format=zip --prefix=Tandem-source/ HEAD app server shared scripts test deploy package.json package-lock.json README.md START-HERE.txt LICENSE .gitignore .dockerignore > release-assets/Tandem-0.3.1-source.zip
          git archive --format=zip --prefix=Tandem-server/ HEAD server deploy package.json package-lock.json LICENSE .dockerignore > release-assets/Tandem-0.3.1-server.zip
          cp START-HERE.txt release-assets/Tandem-0.3.1-start.txt
          cp release-evidence/browser-test-0.3.1.json release-assets/Tandem-0.3.1-browser-test.json
          cd release-assets
          sha256sum Tandem-0.3.1-Windows-x64.zip Tandem-0.3.1-source.zip Tandem-0.3.1-server.zip Tandem-0.3.1-start.txt Tandem-0.3.1-browser-test.json > SHA256SUMS.txt
      - name: Upload and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v0.3.1 release-assets/* --clobber
          asset_api_url="$(gh release view v0.3.1 --json assets --jq '.assets[] | select(.name == "Tandem-0.3.1-Windows-x64.zip") | .apiUrl')"
          digest="$(gh api "$asset_api_url" --jq '.digest')"
          test "$digest" = 'sha256:dc3509f3674cebf48cb1c63822be7a356426531e8cd31d6e81a803eba5b0fc5e'
          gh release edit v0.3.1 --draft=false --prerelease
