name: Publish verified Tandem 0.2.0

on:
  push:
    branches:
      - upload/windows-0.2.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read release instructions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve and verify the prepared Windows archive
        run: |
          mkdir -p release-assets
          curl --fail --location --show-error --retry 2 --connect-timeout 30 --max-time 600 https://files.catbox.moe/gz96yx.zip --output release-assets/Tandem-0.2.0-Windows-x64.zip
          echo 'fd95985d5728fe330e49c4ff4332237946c0f091bd5758edb794cc03d3fb3c4d  release-assets/Tandem-0.2.0-Windows-x64.zip' | sha256sum --check --strict
          cp START-HERE.txt release-assets/Tandem-0.2.0-start.txt
          cd release-assets
          sha256sum Tandem-0.2.0-Windows-x64.zip Tandem-0.2.0-start.txt > SHA256SUMS.txt
      - name: Upload and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v0.2.0 release-assets/Tandem-0.2.0-Windows-x64.zip release-assets/Tandem-0.2.0-start.txt release-assets/SHA256SUMS.txt --clobber
          asset_api_url="$(gh release view v0.2.0 --json assets --jq '.assets[] | select(.name == "Tandem-0.2.0-Windows-x64.zip") | .apiUrl')"
          digest="$(gh api "$asset_api_url" --jq '.digest')"
          test "$digest" = 'sha256:fd95985d5728fe330e49c4ff4332237946c0f091bd5758edb794cc03d3fb3c4d'
          gh release edit v0.2.0 --draft=false --prerelease
